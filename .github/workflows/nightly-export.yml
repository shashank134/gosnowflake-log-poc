name: nightly-export
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Run nightly export
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: cd pipeline && go run .
        # note: the key itself is properly stored in GitHub Secrets —
        # it still ends up in this run's PUBLIC log via the driver's INFO line
      - uses: actions/upload-artifact@v4
        with: { name: report, path: pipeline/report.csv }
